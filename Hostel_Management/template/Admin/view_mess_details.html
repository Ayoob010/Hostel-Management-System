{% extends 'Admin/common.html' %}
{% load static %}
{% block header %}

<style>
    #table {
        width: 100%;
        text-align: center;
        border-collapse: collapse;
    }

    th, td {
        padding: 12px;
        border: 1px solid rgb(196, 196, 196);
    }

    th {
        background-color: #343a40 !important;
        color: white !important;
    }

    tbody tr:hover {
        background-color: #f8f9fa;
    }

    .table-responsive {
        overflow-x: auto;
    }
</style>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>

<div class="mil-content-pad mil-p-100-100">
    <div class="container">
        <center><h2 class="mb-4">Mess Details</h2></center>

        <div class="table-responsive">
            <table id="table" class="table table-hover table-bordered">
                <thead class="table-dark">
                    <tr>
                        <th>Day</th>
                        <th>BreakFast</th>
                        <th>Lunch</th>
                        <th>Dinner</th>
                        <th colspan="2">Action</th>
                    </tr>
                </thead>
                <tbody>
                    {% for i in view %}
                    <tr>
                        <td>{{ i.day }}</td>
                        <td>{{ i.breakfast }}</td>
                        <td>{{ i.lunch }}</td>
                        <td>{{ i.dinner }}</td>
                        <td>
                            <a href="/update_mess_details?mid={{ i.id }}" class="btn btn-sm btn-outline-success">Update</a>
                            <a href="/delete_mess_food?mid={{ i.id }}" class="btn btn-sm btn-outline-danger">Delete</a>
                        </td>
                    </tr>
                    {% empty %}
                    <tr>
                        <td colspan="5" class="text-center text-danger">No mess details found.</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>

{% endblock %}
