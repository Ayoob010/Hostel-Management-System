{% extends 'Admin/common.html' %}
{% load static %}
{% block header %}

<style>
    #table {
        text-align: center !important;
        vertical-align: middle;
    }

    th {
        background-color: #343a40 !important;
        color: white !important;
    }

    tbody tr:hover {
        background-color: #f1f1f1;
    }

    img {
        border-radius: 10px;
    }

    .cards {
        box-shadow: 0 1px 3px 0 rgba(0, 0, 0, .1), 0 1px 2px 0 rgba(0, 0, 0, .06);
    }

    .cards-body {
        padding: 1rem;
    }

    .form-control {
        border: 1px solid #ced4da;
        border-radius: 5px;
        padding: 8px;
    }

    .btn-success {
        width: 100%;
    }
</style>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

<div class="mil-content-pad mil-p-100-100">
    <div class="container">
        <div class="main-body">
            <div class="row gutters-sm">
                <div class="col-md-4 mb-3">
                    <div class="cards">
                        <div class="cards-body">
                            <div class="d-flex flex-column align-items-center text-center">
                                <img src="/static/media/{{uid.image}}" alt="Admin" class="rounded-circle" width="150">
                                <div class="mt-3">
                                    <h4>{{uid.name}}</h4>
                                    <p class="text-secondary mb-1">{{uid.email}}</p>
                                    <p class="text-muted font-size-sm">{{uid.address}}</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- ✅ User Details Section -->
                <div class="col-md-8">
                    <div class="cards mb-3">
                        <div class="cards-body">
                            <div class="row">
                                <div class="col-sm-3">
                                    <h6 class="mb-0">Full Name</h6>
                                </div>
                                <div class="col-sm-9 text-secondary">
                                    <h6 class="mb-0">{{uid.name}}</h6>
                                </div>
                            </div>
                            <hr>
                            <div class="row">
                                <div class="col-sm-3">
                                    <h6 class="mb-0">Email</h6>
                                </div>
                                <div class="col-sm-9 text-secondary">
                                    {{uid.email}}
                                </div>
                            </div>
                            <hr>
                            <div class="row">
                                <div class="col-sm-3">
                                    <h6 class="mb-0">Phone</h6>
                                </div>
                                <div class="col-sm-9 text-secondary">
                                    {{uid.phone}}
                                </div>
                            </div>
                            <hr>
                            <div class="row">
                                <div class="col-sm-3">
                                    <h6 class="mb-0">Address</h6>
                                </div>
                                <div class="col-sm-9 text-secondary">
                                    {{uid.address}}
                                </div>
                            </div>
                            <hr>

                            <!-- ✅ Rent Fee Form Section -->
                            <form action="" method="post">
                                {% csrf_token %}

                                <!-- ✅ Month Dropdown Field -->
                                <div class="row mb-3">
                                    <div class="col-sm-3">
                                        <h6 class="mb-0">Select Month</h6>
                                    </div>
                                    <div class="col-sm-9">
                                        <select name="month" class="form-control" required>
                                            <option value="" disabled selected>-- Select Month --</option>
                                            <option value="January">January</option>
                                            <option value="February">February</option>
                                            <option value="March">March</option>
                                            <option value="April">April</option>
                                            <option value="May">May</option>
                                            <option value="June">June</option>
                                            <option value="July">July</option>
                                            <option value="August">August</option>
                                            <option value="September">September</option>
                                            <option value="October">October</option>
                                            <option value="November">November</option>
                                            <option value="December">December</option>
                                        </select>
                                    </div>
                                </div>

                                <!-- ✅ Rent Fee Field -->
                                <div class="row mb-3">
                                    <div class="col-sm-3">
                                        <h6 class="mb-0">Rent Fee (₹)</h6>
                                    </div>
                                    <div class="col-sm-9">
                                        <input type="text" class="form-control" name="rent_fee" placeholder="Enter Rent Fee" required>
                                    </div>
                                </div>

                                <!-- ✅ Additional Fees Field -->
                                <div class="row mb-3">
                                    <div class="col-sm-3">
                                        <h6 class="mb-0">Additional Fees (₹)</h6>
                                    </div>
                                    <div class="col-sm-9">
                                        <input type="text" class="form-control" name="additional_fee" placeholder="Enter Additional Fees (if any)">
                                    </div>
                                </div>

                                <!-- ✅ Submit Button -->
                                <div class="row">
                                    <div class="col-sm-12">
                                        <input type="submit" class="btn btn-success" value="Add Fees">
                                    </div>
                                </div>
                            </form>
                            <!-- ✅ End of Form -->
                        </div>
                    </div>
                </div>
                <!-- End of User Details Section -->
            </div>
        </div>
    </div>
</div>

{% endblock %}
