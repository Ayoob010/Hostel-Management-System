{% extends 'Admin/common.html' %}
{% load static %}
{% block header %}

<style>
    #table {
        text-align: center !important;
        vertical-align: middle;
    }
    th {
        background-color: #343a40 !important;
        color: white !important;
    }
    tbody tr:hover {
        background-color: #f1f1f1;
    }
    img {
        border-radius: 10px;
    }
</style>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

<div class="mil-content-pad mil-p-100-100">
    <div class="container">
        <h2 class="mb-3" style="margin-left: 360px;">🍽️Meal Opt-Out Summary - Food Count</h2>
        <form method="get" class="text-center mb-4">
            <label for="date">Select Date:</label>
            <input type="date" id="date" class="form-control" name="date" value="{{ selected_date }}"><br>
            <button type="submit" class="btn btn-primary">Filter</button>
        </form>
        <div class="table-responsive">
            <table class="table table-hover table-bordered" id="table">
                <thead class="table-dark">
                <tr>
                    <th>Meals</th>
                    <th>Number of People Opting Out</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>🥞 Breakfast</td>
                    <td>{{ breakfast_count }}</td>
                </tr>
                <tr>
                    <td>🥗 Lunch</td>
                    <td>{{ lunch_count }}</td>
                </tr>
                <tr>
                    <td>🍛 Dinner</td>
                    <td>{{ dinner_count }}</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
</div>
{% endblock %}
